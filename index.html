const PRACTICE_TARGET = 3;

/* ------------------------------- Логика подбора --------------------------- */

function pickProtocol(system, existingProtocol, groupsCount, wantsDimming, wantsScenes) {
  const d = system.devices;

  // 1. Приоритет — протокол уже существующей у клиента экосистемы, если система его поддерживает
  if (existingProtocol && d[existingProtocol]) return existingProtocol;
  // 1b. Клиент на Wi-Fi-экосистеме, но у системы нет отдельного Wi-Fi устройства —
  //     предлагаем смарт-лампу в цоколь, если она физически возможна для этой серии
  if (existingProtocol === "wifi" && !d.wifi && system.bulbSocket) return "wifiBulb";

  // 2. Нужно больше одной группы освещения. По-настоящему это умеют:
  //    а) механическое зонирование (см. getMaxGroups) —
  if (groupsCount > 1 && !wantsDimming && !wantsScenes && d.onoff && d.onoff.maxGroups && d.onoff.maxGroups >= groupsCount) {
    return "onoff";
  }
  //    б) системы с адресными смарт-светильниками — группы решаются адресацией по DALI/Zigbee
  if (groupsCount > 1 && system.addressableGroups) {
    if (wantsScenes && d.dali) return "dali";
    if (wantsScenes && d.zigbee) return "zigbee";
    if (d.dali) return "dali";
    if (d.zigbee) return "zigbee";
  }
  //    Для всех остальных систем DALI/Zigbee/UNION группу физически не делят —
  //    решение принимается как для одной зоны, а несовпадение с запросом
  //    отражается отдельным предупреждением (см. groupsExceeded).

  // 3. Нужны световые сценарии (одна группа)
  if (wantsScenes) {
    if (d.dali) return "dali"; // профессиональные сценарии с адресацией
    if (d.zigbee) return "zigbee"; // сценарии через приложение, если DALI нет
  }

  // 4. Нужно просто диммирование, без сценариев
  if (wantsDimming) {
    if (d.triac) return "triac"; // самый простой и привычный вариант
    if (d.dali) return "dali";
    if (d.zigbee) return "zigbee";
    if (d.wifi) return "wifi";
    if (d.ble) return "ble";
    if (d.union) return "union";
    if (system.bulbSocket) return "wifiBulb"; // смарт-лампа как последний вариант диммирования
  }

  // 5. Базовый сценарий — просто должно работать
  if (d.triac) return "triac";
  if (d.union) return "union";
  if (d.ble) return "ble";
  if (d.wifi) return "wifi";
  return "onoff";
}

/* Максимум групп, который система физически может обеспечить.
   По-настоящему независимые группы на одном треке умеют делать только системы
   с механическим зонированием (Gravity, Trinity, Exility X — см. onoff.maxGroups)
   либо системы с адресными смарт-светильниками (флаг addressableGroups) — там
   деление на группы решается адресацией по Zigbee/DALI, а не количеством клавиш.
   Наличие DALI/Zigbee само по себе (без этих условий) НЕ даёт нескольких
   независимых групп — это управление отдельными светильниками внутри одной зоны. */
function getMaxGroups(system) {
  if (system.addressableGroups) return null;
  const d = system.devices;
  if (d.onoff && d.onoff.maxGroups) return d.onoff.maxGroups;
  return 1;
}

function groupWord(n) {
  return n === 1 ? "группа" : "группы";
}

/* Может ли система вообще диммировать — любым протоколом или смарт-лампой в цоколь. */
function canDim(system) {
  const d = system.devices;
  if (d.triac || d.dali || d.zigbee || d.wifi || d.ble || d.union) return true;
  if (system.bulbSocket) return true;
  return false;
}

/* Может ли система строить световые сценарии — только DALI и Zigbee умеют. */
function canScenes(system) {
  const d = system.devices;
  return !!(d.dali || d.zigbee);
}

/* Обозначение протокола для сообщений о несовпадении экосистемы клиента. */
function ecosystemMismatch(system, existingProtocol) {
  if (!existingProtocol || existingProtocol === "no") return null;
  if (system.devices[existingProtocol]) return null;
  if (existingProtocol === "wifi" && system.bulbSocket) return null; // есть валидный обходной путь
  return PROTOCOLS[existingProtocol].label;
}

/* Мастер-контроллер DALI нужен в заказе только когда клиент только планирует умный дом
   по DALI и ещё не купил управляющие устройства. Если DALI-экосистема у клиента уже есть —
   контроллер не обязателен, это не нужно включать по умолчанию. */
function daliControllerNote(clientAlreadyHasDali) {
  return clientAlreadyHasDali
    ? "Мастер-контроллер в заказ не обязателен: судя по ответу, DALI-экосистема и управляющие устройства у клиента уже есть — уточните перед добавлением в КП."
    : "Мастер-контроллер нужен в заказе: клиент только планирует умный дом по DALI и ещё не купил управляющие устройства — без контроллера сценарии не настроить.";
}

/* «Каждый светильник — свой адрес» верно только там, где реально есть трековые
   DALI-светильники с индивидуальной адресацией (Exility, Exility X). У остальных
   систем DALI — это точка интеграции трека в уже существующую DALI-систему умного
   дома клиента, а не адресация каждого светильника по отдельности. */
function daliCopyFor(system) {
  if (system.addressableGroups) {
    return {
      analogy: "Дирижёр оркестра — у каждого светильника свой адрес.",
      phrase: "«Можно выстроить световые сценарии: утро, вечер, презентация — одним нажатием».",
    };
  }
  return {
    analogy: "Не адресация каждого светильника, а точка входа — трек подключается в общую DALI-систему умного дома клиента.",
    phrase: "«Эта система интегрируется в вашу DALI-систему умного дома — сценариями и группами управляет общий контроллер здания, не мы».",
  };
}

function getDeviceInfo(system, protoKey) {
  if (protoKey === "wifiBulb") {
    return { text: "Вкрутите умную Wi-Fi-лампу в цоколь GU10 или GX53 — диммирование и изменение цветовой температуры, отдельный контроллер не нужен." };
  }
  return system.devices[protoKey] || null;
}

function ProtocolNavigator() {
  const [screen, setScreen] = useState("intro"); // intro | form | result | quizIntro | quiz | done
  const [systemId, setSystemId] = useState(SYSTEMS[0].id);
  const [groupsCount, setGroupsCount] = useState(null); // 1 | 2 | 3
  const [wantsDimming, setWantsDimming] = useState(null); // 'yes' | 'no'
  const [wantsScenes, setWantsScenes] = useState(null); // 'yes' | 'no'
  const [existingProtocol, setExistingProtocol] = useState(null); // protocol key | 'no'
  const [result, setResult] = useState(null);
  const [practiced, setPracticed] = useState([]);
  const [copied, setCopied] = useState(false);
  const [quizIndex, setQuizIndex] = useState(0);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const copyTimer = useRef(null);

  const system = useMemo(() => SYSTEMS.find((s) => s.id === systemId), [systemId]);
  const practiceCount = practiced.length;
  const quizUnlocked = practiceCount >= PRACTICE_TARGET;

  const maxGroups = useMemo(() => getMaxGroups(system), [system]);
  const groupsExceeded = groupsCount !== null && maxGroups !== null && groupsCount > maxGroups;
  const dimmingImpossible = wantsDimming === "yes" && !canDim(system);
  const scenesImpossible = wantsScenes === "yes" && !canScenes(system);
  const ecosystemLabel = ecosystemMismatch(system, existingProtocol);

  const canSubmit =
    groupsCount !== null &&
    wantsDimming !== null &&
    wantsScenes !== null &&
    existingProtocol !== null;

  const overallFraction = useMemo(() => {
    if (screen === "intro") return 0;
    if (screen === "quiz" || screen === "quizIntro") return 0.6 + (quizIndex / QUIZ.length) * 0.35;
    if (screen === "done") return 1;
    return 0.1 + Math.min(practiceCount, PRACTICE_TARGET) * 0.15;
  }, [screen, practiceCount, quizIndex]);

  const resetForm = useCallback((nextId) => {
    setSystemId(nextId || systemId);
    setGroupsCount(null);
    setWantsDimming(null);
    setWantsScenes(null);
    setExistingProtocol(null);
    setResult(null);
    setCopied(false);
    setScreen("form");
  }, [systemId]);

  const handleSubmit = () => {
    const realExisting = existingProtocol && existingProtocol !== "no" ? existingProtocol : null;
    const protoKey = pickProtocol(system, realExisting, groupsCount, wantsDimming === "yes", wantsScenes === "yes");
    let deviceInfo = getDeviceInfo(system, protoKey);
    if (protoKey === "dali" && deviceInfo && deviceInfo.items && deviceInfo.items.length) {
      deviceInfo = { ...deviceInfo, note: daliControllerNote(realExisting === "dali") };
    }
    const copyOverride = protoKey === "dali" ? daliCopyFor(system) : null;
    const notes = [];
    if (groupsExceeded) {
      notes.push(`Запрошено ${groupsCount} ${groupWord(groupsCount)}, но ${system.name} поддерживает максимум ${maxGroups} ${groupWord(maxGroups)} освещения.`);
    }
    if (dimmingImpossible) {
      notes.push(`${system.name} не поддерживает диммирование ни одним протоколом — только включение/выключение.`);
    }
    if (scenesImpossible) {
      notes.push(`${system.name} не поддерживает световые сценарии — нет ни DALI, ни Zigbee.`);
    }
    if (ecosystemLabel) {
      notes.push(`${system.name} не работает напрямую с протоколом клиента (${ecosystemLabel}) — показан ближайший доступный вариант.`);
    }
    setResult({ protoKey, deviceInfo, notes, copyOverride });
    setPracticed((prev) => (prev.includes(system.id) ? prev : [...prev, system.id]));
    setScreen("result");
  };

  const handleTryAnother = () => {
    const remaining = SYSTEMS.filter((s) => !practiced.includes(s.id));
    const next = remaining.length ? remaining[0] : SYSTEMS[(SYSTEMS.findIndex((s) => s.id === systemId) + 1) % SYSTEMS.length];
    resetForm(next.id);
  };

  const handleCopy = async () => {
    if (!result) return;
    const proto = PROTOCOLS[result.protoKey];
    const deviceLine = result.deviceInfo
      ? [result.deviceInfo.text, ...(result.deviceInfo.items || []).map((it) => it.label)].join("; ")
      : "не предусмотрено";
    const caveatLine = system.caveat ? `\nВажно: ${system.caveat}` : "";
    const text = `${system.name} — ${proto.label}\nУстройства: ${deviceLine}${caveatLine}`;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      /* clipboard недоступен — молча игнорируем в демо-режиме */
    }
    setCopied(true);
    clearTimeout(copyTimer.current);
    copyTimer.current = setTimeout(() => setCopied(false), 2200);
  };

  const startQuiz = () => {
    setQuizIndex(0);
    setSelectedOpt(null);
    setAnswered(false);
    setScore(0);
    setScreen("quiz");
  };

  const handleAnswer = (idx) => {
    if (answered) return;
    setSelectedOpt(idx);
    setAnswered(true);
    if (idx === QUIZ[quizIndex].correct) setScore((s) => s + 1);
  };

  const nextQuestion = () => {
    if (quizIndex + 1 < QUIZ.length) {
      setQuizIndex((i) => i + 1);
      setSelectedOpt(null);
      setAnswered(false);
    } else {
      setScreen("done");
    }
  };

  const restartAll = () => {
    setPracticed([]);
    setScore(0);
    setQuizIndex(0);
    resetForm(SYSTEMS[0].id);
    setScreen("intro");
  };

  return (
    <div className={`pn-root${screen === "intro" ? " pn-root--wide" : ""}`}>
      <style>{`
        .pn-root {
          --black:${C.black}; --white:${C.white}; --gray:${C.gray};
          --grayLight:${C.grayLight}; --grayLine:${C.grayLine}; --violet:${C.violet};
          box-sizing: border-box;
          font-family: Arial, Helvetica, sans-serif;
          background: var(--white);
          color: var(--black);
          max-width: 560px;
          margin: 0 auto;
          border: 1px solid var(--grayLine);
          min-height: 640px;
          display: flex;
          flex-direction: column;
          transition: max-width 200ms ease;
        }
        /* Стартовая страница показывается на полный рост курса в LMS —
           1366–1440px это самое частое разрешение ноутбуков, на котором
           курс открывают. Остальные экраны (форма/результат/квиз) держат
           узкую ширину — так удобнее читать текст построчно. */
        .pn-root.pn-root--wide {
          max-width: 1400px;
        }
        .pn-root *, .pn-root *::before, .pn-root *::after { box-sizing: border-box; }
        .pn-root button { font-family: inherit; cursor: pointer; }
        .pn-root button:focus-visible,
        .pn-root [tabindex]:focus-visible,
        .pn-root select:focus-visible,
        .pn-root a:focus-visible {
          outline: 2px solid var(--violet);
          outline-offset: 2px;
        }

          display: flex; align-items: center; justify-content: space-between;
          padding: 18px 24px 14px;

        }

        }

            <p className="pn-eyebrow">Блок завершён</p>
            <h1 className="pn-h1">Готово! Результат сохранён в вашем прогрессе по курсу</h1>
            <p className="pn-done-score">{score}<span> / {QUIZ.length} верно</span></p>
            <p className="pn-sub" style={{ marginTop: 4 }}>Практика: {practiceCount} из {PRACTICE_TARGET} систем пройдено.</p>
            <div className="pn-actions">
              <button className="pn-cta" onClick={restartAll}>Пройти ещё раз</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ProtocolNavigator />);
</script>
</body>
</html>
